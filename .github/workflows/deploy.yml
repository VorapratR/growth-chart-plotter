name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege + the tokens the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build dist/index.html
        run: bash build.sh

      - name: Sanity-check the bundle
        run: |
          bytes=$(wc -c < dist/index.html)
          echo "dist/index.html = ${bytes} bytes"
          [ "$bytes" -ge 1000000 ] || { echo "::error::bundle too small — build broken"; exit 1; }
          grep -q "</body></html>" dist/index.html || { echo "::error::bundle truncated"; exit 1; }

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
