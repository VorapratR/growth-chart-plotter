<style>
:root{
  --ink:#14171C; --muted:#6B7280; --line:#E3E6EA; --bg:#EFF1F4; --surface:#FFFFFF;
  --paper:#FAEEF2; --rule-min:#F1CBD8; --rule-maj:#DE8FA9; --curve:#A9476A; --curve-mid:#7A2F49; --brand:#A9476A;
}
body[data-sex="M"]{
  --paper:#E8F3FA; --rule-min:#C6E2F1; --rule-maj:#74B7D9; --curve:#2A7099; --curve-mid:#14506F; --brand:#2A7099;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Thai",system-ui,sans-serif; font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

header.top{
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:14px 20px; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap;
}
header.top h1{font-size:16px; font-weight:600; margin:0; letter-spacing:-.01em}
header.top .sub{font-size:12px; color:var(--muted)}
.badge{
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.04em;
  border:1px solid var(--rule-maj); color:var(--curve-mid); background:var(--paper);
  padding:2px 8px; border-radius:2px;
}

.wrap{display:grid; grid-template-columns:340px 1fr; gap:16px; padding:16px; align-items:start; max-width:1500px; margin:0 auto}
.wrap > div{min-width:0}
@media (max-width:980px){ .wrap{grid-template-columns:1fr} }
@media print{
  body{background:#fff}
  header.top .sub, header.top .badge{display:none}
  .wrap{display:block; padding:0; max-width:none}
  .wrap > div:first-child{display:none}
  .card{border:none; box-shadow:none; page-break-inside:avoid}
  .tools, #addRow{display:none}
  table.visits{display:none}
}

.card{background:var(--surface); border:1px solid var(--line); border-radius:4px}
.card > h2{
  font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
  margin:0; padding:12px 14px 10px; border-bottom:1px solid var(--line);
}
.card .body{padding:14px}

label.f{display:block; margin-bottom:12px}
label.f > span{display:block; font-size:11px; color:var(--muted); margin-bottom:4px; letter-spacing:.02em}
input[type=date],input[type=number],input[type=text],input[type=search],select{
  width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:3px; background:#fff;
  font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--ink);
}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand); outline-offset:1px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

.seg{display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden}
.seg.seg4 button{font-size:11.5px; padding:8px 4px}
.seg button{
  flex:1; padding:8px; border:0; background:#fff; cursor:pointer; font:inherit; font-size:13px; color:var(--muted);
}
.seg button[aria-pressed="true"]{background:var(--paper); color:var(--curve-mid); font-weight:600; box-shadow:inset 0 -2px 0 var(--curve)}

.mph{
  margin-top:2px; padding:10px 12px; background:var(--paper); border:1px solid var(--rule-min); border-radius:3px;
  display:flex; justify-content:space-between; align-items:baseline;
}
.mph b{font-family:"IBM Plex Mono",monospace; font-size:16px; color:var(--curve-mid)}
.mph span{font-size:11px; color:var(--muted)}

table.visits{width:100%; border-collapse:collapse}
table.visits th{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; text-align:left; padding:0 4px 6px}
table.visits td{padding:2px}
table.visits input{padding:5px 6px; font-size:12px}
td.warn-cell input{border-color:#D9534F; background:#FDECEC}
button.mini{border:1px solid var(--line); background:#fff; border-radius:3px; cursor:pointer; color:var(--muted); width:26px; height:28px; font-size:15px; line-height:1}
button.mini:hover{border-color:var(--curve); color:var(--curve)}
button.add{
  margin-top:10px; width:100%; padding:8px; border:1px dashed var(--rule-maj); background:transparent;
  color:var(--curve-mid); border-radius:3px; cursor:pointer; font:inherit; font-size:13px;
}
button.add:hover{background:var(--paper)}
.tools{display:flex; gap:8px; margin-top:10px}
.tools button{flex:1; padding:7px; border:1px solid var(--line); background:#fff; border-radius:3px; cursor:pointer; font:inherit; font-size:12px; color:var(--muted)}
.tools button:hover{border-color:var(--curve); color:var(--curve)}

/* patient list (sidebar) */
.ptlist{max-height:240px; overflow-y:auto; margin:2px -2px 0; -webkit-overflow-scrolling:touch}
.pt{display:flex; align-items:center; gap:6px; padding:6px 8px; border:1px solid transparent; border-radius:3px; cursor:pointer}
.pt:hover{background:var(--paper)}
.pt.cur{background:var(--paper); border-color:var(--rule-min); cursor:default}
.pt-main{flex:1; min-width:0}
.pt-main b{display:block; font-size:12.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pt-main span{display:block; font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pt .mini{flex:none; width:24px; height:24px; font-size:13px}
.pt-empty{padding:12px 8px; color:var(--muted); font-size:11.5px; text-align:center}
button.linky{display:block; width:100%; margin-top:6px; padding:4px; border:0; background:none; color:var(--curve-mid); font:inherit; font-size:11px; cursor:pointer; text-decoration:underline}

.chartwrap{padding:10px 6px 6px; overflow-x:auto; -webkit-overflow-scrolling:touch}
svg.chart{width:100%; min-width:900px; height:auto; aspect-ratio:900/706; display:block; font-family:"IBM Plex Mono",monospace}

table.out{width:100%; min-width:680px; border-collapse:collapse; font-family:"IBM Plex Mono",monospace; font-size:12px}
#results{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.out th{font-family:"IBM Plex Sans Thai",sans-serif; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; text-align:right; padding:8px 10px; border-bottom:1px solid var(--line)}
table.out th:first-child,table.out td:first-child{text-align:left}
table.out td{padding:7px 10px; border-bottom:1px solid var(--line); text-align:right}
table.out tr:last-child td{border-bottom:0}
.band{display:inline-block; padding:1px 6px; border-radius:2px; font-size:11px; background:var(--paper); color:var(--curve-mid); border:1px solid var(--rule-min)}
.band.out{background:#FDECEC; color:#A32B2B; border-color:#F4C7C7}
.empty{padding:24px 14px; color:var(--muted); font-size:13px}
.note{font-size:11px; color:var(--muted); padding:10px 14px; border-top:1px solid var(--line); line-height:1.6}
code{font-family:"IBM Plex Mono",monospace; background:var(--bg); padding:1px 4px; border-radius:2px; font-size:11px}
</style>
</head>
<body data-sex="F">
